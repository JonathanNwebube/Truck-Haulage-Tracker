% extends "base.html" %} {% block title %}Create Account{% endblock %}

<!-- Building an HTML form -->
<form method="POST"> <!-- When submitting the form it will send a POST request -->
    <h3 align="center"> Create Account</h3> <!-- A header for the from aligned in the middle -->
    
    <div class = "form-group"> <!-- This is a bootstrap class -->
    <!-- The fields of this form -->
        <label for="first_name">First Name</label> <!-- Setting it to the class used for the input field-->
        <input 
            type="text" 
            class="form-control" 
            id ="first_name" 
            name="first_name" 
            placeholder="Enter First Name" 
        />
            <!-- the name is what the attribute is called when passing the information in this field to backend -->
    </div>

    <div class = "form-group">
            <label for="second_name">Second Name</label> 
            <input 
                type="text" 
                class="form-control" 
                id ="second_name" 
                name="second_name" 
                placeholder="Enter Second Name"
            />
    </div>

    <div class = "form-group">
        <label for="email">email</label> 
        <input 
            type="email" 
            class="form-control" 
            id ="email" 
            name="email" 
            placeholder="Enter Email Address"
        />
    </div>

    <div class = "form-group">
        <label for="password">Password</label> 
        <input 
            type="text" 
            class="form-control" 
            id ="password" 
            name="password" 
            placeholder="Enter Password"
        />
    </div>

    <div class = "form-group">
        <label for="password_confirm">Password Confirm</label> 
        <input 
            type="text" 
            class="form-control" 
            id ="password_confirm" 
            name="password_confirm" 
            placeholder="Confirm Password"
        />
    </div>
    <br />
    <button type="submit" class="btn btn-primary">Submit</button> 

</form>
