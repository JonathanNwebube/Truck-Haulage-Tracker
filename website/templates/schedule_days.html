{% extends "base.html" %} {% block title %}Add Job{% endblock %} {% block content %}

<form method="POST">
    <h3 align="center">Schedule Information</h3> 
    
    <div class = "form-group">
        <label for="date">Date</label> <br>
        <input 
            type="date" 
            id ="date" 
            name="date" 
        />
    </div>


    <div class = "form-group">
        <label for="time">Start Time</label> <br>
        <input 
            type="time" 
            id ="time" 
            name="time" 
        />
    </div>

    <div class = "form-group">
        <label for="tractorID">tractorID</label> 
        <input 
            type="text" 
            class="form-control" 
            id ="tractorID" 
            name="tractorID" 
            placeholder="Enter tractorID"
        />
    </div>

    <div class = "form-group">
        <label for="start_location">Start Location</label> 
        <input 
            type="text" 
            class="form-control" 
            id ="start_location" 
            name="start_location" 
            placeholder="Enter the site of the start location"
        />
    </div>    

    <div class = "form-group">
        <label for="end_location">End Location</label> 
        <input 
            type="text" 
            class="form-control" 
            id ="end_location" 
            name="end_location" 
            placeholder="Enter the site of the end location"
        />
    </div>  
        <button type="submit" class="btn btn-primary">Add Job Information</button>
</form>

{% endblock %}
